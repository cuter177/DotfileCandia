[general]
framerate = 30
; Ancho: número de columnas. 8 es compacto; 10–12 es más continuo.
bars = 16
sleep_timer = 8
channels = mono
mono_option = average
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /tmp/cava-waybar.fifo
data_format = ascii
ascii_max_range = 8
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
; Movimiento más fluido, sin saltos entre frames.
monstercat = 1
waves = 0
noise_reduction = 70
